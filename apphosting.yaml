# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0

# Environment variables and secrets.
env:
  # Signs the CMS login cookie (secret, created with the commands below).
  - variable: CMS_SECRET
    secret: CMS_SECRET

  # PackMyBags Firebase project (optional: the code already defaults to these).
  - variable: FIREBASE_PROJECT_ID
    value: "pack-my-bags-1c85e"
    availability:
      - RUNTIME

  - variable: FIREBASE_DATABASE_URL
    value: "https://pack-my-bags-1c85e-default-rtdb.asia-southeast1.firebasedatabase.app"
    availability:
      - RUNTIME

  - variable: FIREBASE_STORAGE_BUCKET
    value: "pack-my-bags-1c85e.firebasestorage.app"
    availability:
      - RUNTIME